<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
	<!-- Cyberpunk 2077 cursor: the in-game cyan square with a short inner dash. Solid (opaque dark fill)
	     with a black outline so it never blends into cyan UI underneath. Hotspot: center (16 16). -->
	<rect x="7" y="7" width="18" height="18" fill="none" stroke="#000000" stroke-width="4" />
	<rect x="8" y="8" width="16" height="16" fill="#0a1418" stroke="#5ef6ff" stroke-width="1.8" />
	<rect x="12.5" y="15.1" width="7" height="1.8" fill="#5ef6ff" />
</svg>
