<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
	<!-- Cyberpunk 2077 cursor over clickable things: the square fills in solid cyan with a dark dash,
	     outlined in black so it stays visible on cyan UI. Hotspot: center (16 16). -->
	<rect x="6" y="6" width="20" height="20" fill="none" stroke="#000000" stroke-width="4" />
	<rect x="7" y="7" width="18" height="18" fill="#5ef6ff" stroke="#dffdff" stroke-width="1.4" />
	<rect x="12" y="15.1" width="8" height="1.8" fill="#0a1418" />
</svg>
