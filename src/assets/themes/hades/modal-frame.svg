<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="48" height="48" viewBox="0 0 48 48">
	<!-- Hades-style modal frame (like the in-game dialogue boxes), used as a 9-slice CSS
	     border-image (slice 16, repeat "round"). From the outside in: ink line, beveled gold rail
	     (bright top/left, darker bottom/right), ink line, thin bronze line, ink line.
	     Small gold knobs sit on the corners, and the bottom edge's middle tile carries a row of
	     little ink notches that repeats along the bottom, like the dialogue box's lower trim. -->

	<!-- Outer ink -->
	<rect x="0.75" y="0.75" width="46.5" height="46.5" fill="none" stroke="#0d0a06" stroke-width="1.5" />
	<!-- Gold rail -->
	<rect x="4.25" y="4.25" width="39.5" height="39.5" fill="none" stroke="#c9a13e" stroke-width="5.5" />
	<!-- Bevel -->
	<path d="M2.2 45.8 V2.2 H45.8" fill="none" stroke="#f2d77a" stroke-width="1.3" />
	<path d="M2.2 45.8 H45.8 V2.2" fill="none" stroke="#7d5e1c" stroke-width="1.3" />
	<!-- Inner ink, thin bronze line, inner ink -->
	<rect x="7.75" y="7.75" width="32.5" height="32.5" fill="none" stroke="#0d0a06" stroke-width="1.5" />
	<rect x="9.25" y="9.25" width="29.5" height="29.5" fill="none" stroke="#9c7a2c" stroke-width="1.5" />
	<rect x="10.5" y="10.5" width="27" height="27" fill="none" stroke="#0d0a06" stroke-width="1" />

	<!-- Bottom trim: little ink notches along the bottom rail (only in the bottom-middle tile) -->
	<g fill="#0d0a06">
		<rect x="17" y="42.2" width="1.6" height="3.4" rx="0.5" />
		<rect x="21" y="42.2" width="1.6" height="3.4" rx="0.5" />
		<rect x="25" y="42.2" width="1.6" height="3.4" rx="0.5" />
		<rect x="29" y="42.2" width="1.6" height="3.4" rx="0.5" />
	</g>

	<!-- Corner knobs -->
	<g id="knob" stroke="#0d0a06" stroke-width="1.4">
		<circle cx="5" cy="5" r="4.2" fill="#e2b64a" />
		<circle cx="3.9" cy="3.9" r="1.2" fill="#fff3c4" stroke="none" />
	</g>
	<use href="#knob" xlink:href="#knob" transform="translate(48 0) scale(-1 1)" />
	<use href="#knob" xlink:href="#knob" transform="translate(0 48) scale(1 -1)" />
	<use href="#knob" xlink:href="#knob" transform="translate(48 48) scale(-1 -1)" />
</svg>
