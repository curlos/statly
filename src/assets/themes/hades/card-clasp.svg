<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 40">
	<!-- Small gold scroll clasp that sits on the left edge of Hades cards
	     (like the one on the left of the in-game tooltips). Pen & ink style:
	     even ink outline, flat gold with a darker shaded side and a bright highlight. -->
	<g stroke="#0d0a06" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
		<!-- Clasp body -->
		<path d="M13 3 C5 5 2 13 8 20 C2 27 5 35 13 37 C17 30 17 10 13 3 Z" fill="#e2b64a" />
		<!-- Shaded right half -->
		<path d="M13 5 C16 12 16 28 13 35 C11 30 11 10 13 5 Z" fill="#8a6a1e" stroke="none" />
		<!-- Scroll curls -->
		<path d="M8 20 C5 17 7 13 10 14 C12 15 11 18 9 17" fill="none" stroke-width="1.6" />
		<path d="M8 20 C5 23 7 27 10 26 C12 25 11 22 9 23" fill="none" stroke-width="1.6" />
	</g>
	<path d="M11 6 C7 8 5 12 6 16" fill="none" stroke="#fff3c4" stroke-width="1.2" stroke-linecap="round" />
</svg>
